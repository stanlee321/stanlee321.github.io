<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% feed_meta %}
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%230f1115'/%3E%3Cg fill='none' stroke='%236aa9ff' stroke-width='4' stroke-linecap='round'%3E%3Cpath d='M14 14v36'/%3E%3Cpath d='M50 14v36'/%3E%3Cpath d='M14 14h6'/%3E%3Cpath d='M14 50h6'/%3E%3Cpath d='M50 14h-6'/%3E%3Cpath d='M50 50h-6'/%3E%3C/g%3E%3Ctext x='32' y='42' font-family='Georgia,serif' font-size='26' fill='%23e8eaed' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"
          onload="renderMathInElement(document.body, {delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}], throwOnError: false});"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="site-title" href="{{ '/' | relative_url }}">Stanley Salvatierra</a>
      <nav class="site-nav" aria-label="Main">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/blog/' | relative_url }}">Blog</a>
        <a href="{{ '/publications/' | relative_url }}">Publications</a>
        <a href="{{ '/projects/' | relative_url }}">Projects</a>
        <a class="icon-link" href="https://github.com/{{ site.github_username }}" rel="me noopener" aria-label="GitHub">
          <svg viewBox="0 0 16 16" width="18" height="18" aria-hidden="true" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.4 7.4 0 0 1 2-.27c.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
        <a class="icon-link" href="https://x.com/{{ site.twitter_username }}" rel="me noopener" aria-label="X">
          <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true" fill="currentColor"><path d="M12.6 0h2.45l-5.36 6.12L16 16h-4.94l-3.87-5.06L2.76 16H.31l5.73-6.55L0 0h5.06l3.5 4.62L12.6 0Zm-.86 14.55h1.36L4.32 1.37H2.87l8.87 13.18Z"/></svg>
        </a>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; {{ site.time | date: '%Y' }} Stanley Salvatierra &middot;
        <a href="{{ '/feed.xml' | relative_url }}">RSS</a> &middot;
        built with GitHub Pages</p>
    </div>
  </footer>
</body>
</html>
